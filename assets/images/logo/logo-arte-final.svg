<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arte Final — Pisos de Madeira">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E543A"/>
      <stop offset="1" stop-color="#0E1A13"/>
    </linearGradient>
    <linearGradient id="plank1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E4DA"/>
      <stop offset="1" stop-color="#4FA57A"/>
    </linearGradient>
    <linearGradient id="plank2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA57A"/>
      <stop offset="1" stop-color="#2F7A55"/>
    </linearGradient>
    <linearGradient id="plank3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7A55"/>
      <stop offset="1" stop-color="#1E543A"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="4" fill="url(#bg)" stroke="#D9E4DA" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Letter A formed by wood planks -->
  <g>
    <!-- Left leg -->
    <path d="M12 48 L28 16 L32 16 L32 21 L28.5 21 L18 44 L24 44 L24 48 Z" fill="url(#plank1)"/>
    <!-- Right leg -->
    <path d="M52 48 L36 16 L32 16 L32 21 L35.5 21 L46 44 L40 44 L40 48 Z" fill="url(#plank2)"/>
    <!-- Crossbar -->
    <rect x="25" y="32" width="14" height="4.5" fill="url(#plank3)"/>
  </g>

  <!-- Floor texture lines -->
  <line x1="6" y1="56" x2="58" y2="56" stroke="#D9E4DA" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="6" y1="52" x2="58" y2="52" stroke="#D9E4DA" stroke-opacity="0.15" stroke-width="1"/>
</svg>